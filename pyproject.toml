[project]
name = "administracion-carteras"
version = "0.1.0"
description = "Optimización de carteras con Black-Litterman (skfolio) sobre el universo de empresas de empresas_data_final.xlsx"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    # Núcleo científico
    "numpy>=2.5",
    "pandas>=3.0",
    "scipy>=1.18",
    "scikit-learn>=1.9",
    # Optimización
    "skfolio>=1.0.1",
    "cvxpy>=1.9",
    # Datos de mercado y carga del Excel
    "yfinance>=1.7",
    "openpyxl>=3.1.5",
    "pyarrow>=25.0",
    # Visualización
    "matplotlib>=3.11",
    "plotly>=7.0",
    # Notebooks
    "jupyterlab>=4.6",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"
